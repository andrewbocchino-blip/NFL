name: capture-odds

# The time-critical job. nflverse ships CLOSING lines only, so the opener
# record cannot be backfilled — every missed window is lost permanently.
# This is the one workflow that must keep running.

on:
  schedule:
    # Every 3h, ALL SEVEN DAYS. The old schedule ran Tue-Sat plus a narrow
    # Sunday kickoff window, which left an 18-hour hole from Saturday
    # evening to Sunday morning and skipped Monday entirely — so Monday
    # night games were never captured, and Sunday injury news landed in the
    # gap. Costs ~30 extra credits a week.
    - cron: '0 */3 * * *'
    # tighter cadence through the Sunday kickoff window (UTC)
    - cron: '0,30 15,16,17 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-odds
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Verify odds math before spending credits
        run: python nfl_lines.py selftest

      - name: Capture board
        env:
          ODDS_PROXY: ${{ secrets.ODDS_PROXY }}
          ODDS_REGION: us
        run: python nfl_lines.py snapshot

      - name: Screen for off-market prices (PAPER ONLY)
        env:
          ODDS_PROXY: ${{ secrets.ODDS_PROXY }}
        run: python nfl_lines.py screen --log || true

      # Publishes docs/PICKS.md from prices already on disk. No API credits.
      # Guarded: the capture above is the irreplaceable part, so a missing or
      # broken board must never block the snapshot from being committed.
      - name: Refresh board
        run: |
          if [ -f nfl_picks.py ]; then
            python nfl_picks.py --days 7 --top 15 --out docs/PICKS.md \
              || echo "board failed — snapshot still commits"
          else
            echo "nfl_picks.py not present — skipping board"
          fi

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet && echo "no line movement to record" && exit 0
          git commit -m "capture: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
