name: capture-props

# SEPARATE from capture-odds because the cost profile is completely
# different. Game lines are one bulk call. Props bill per event per market
# per region.
#
# MEASURED 2026-09-10: the events endpoint returns the FULL SEASON — 187
# events, not the 16 in the current week. Unfiltered that is 187 x 5 = 935
# credits per sweep and ~134,000 across a season against a 20,000 plan.
# --within-days is what makes props affordable; do not remove it.
#
#   --within-days 7, 2x/day Thu-Sun   ~=  80/sweep,  5,800/season   FITS
#   no filter                         ~= 935/sweep, 134,000/season  DOES NOT
#
# nfl_props.py also enforces MAX_CREDITS_PER_RUN as a hard stop.

on:
  schedule:
    - cron: '0 14,22 * * 4,5,6,0'
  workflow_dispatch:
    inputs:
      within_days:
        description: 'Only sweep games kicking off within N days'
        default: '7'
      game_id:
        description: 'Single event id (cheapest possible run, ~5 credits)'
        default: ''
      max_events:
        description: 'Cap events this run (blank = all within window)'
        default: ''

permissions:
  contents: write

concurrency:
  group: capture-props
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify prop math before spending credits
        run: python nfl_props.py selftest

      - name: Show what this sweep will cost
        env:
          ODDS_PROXY: ${{ secrets.ODDS_PROXY }}
        run: python nfl_props.py budget --within-days ${{ inputs.within_days || '7' }}

      - name: Capture props
        env:
          ODDS_PROXY: ${{ secrets.ODDS_PROXY }}
          MAX_CREDITS_PER_RUN: '120'
        run: |
          python nfl_props.py capture \
            --within-days ${{ inputs.within_days || '7' }} \
            ${{ inputs.game_id && format('--game-id {0}', inputs.game_id) || '' }} \
            ${{ inputs.max_events && format('--max-events {0}', inputs.max_events) || '' }}

      - name: Screen props (PAPER ONLY)
        env:
          ODDS_PROXY: ${{ secrets.ODDS_PROXY }}
        run: python nfl_props.py screen --log || true

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "no movement to record" && exit 0
          git commit -m "props: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
